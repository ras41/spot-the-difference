<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot the Difference</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1 id="game-title">Loading Game...</h1>

      <div class="stats-container">
        <div class="score-container">
          Score: <span id="score">0</span> / <span id="total-diff">0</span>
        </div>
        <div class="timer-container">Time: <span id="timer">00:00</span></div>
      </div>
    </header>
    <main class="game-container">
      <div class="image-wrapper" id="image-wrapper-1">
        <img id="game-image-1" alt="Game Image 1" />
      </div>
      <div class="image-wrapper" id="image-wrapper-2">
        <img id="game-image-2" alt="Game Image 2" />
      </div>
    </main>

    <div id="success-message" class="hidden">
      <h2>Congratulations! You found them all!</h2>
    </div>

    <script src="script.js"></script>
  </body>
</html>
